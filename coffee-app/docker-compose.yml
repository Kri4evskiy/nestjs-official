services:
  db:
    image:  postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
       POSTGRES_PASSWORD: pass123
    volumes:
      - postgres_data_coffee_app:/var/lib/postgresql

  test-db:
    profiles: ["test"]
    image: postgres
    restart: always
    ports:
      - "5433:5432" # 👈 Note the 5433 port (since we are using 5432 for our regular db)
    environment:
      POSTGRES_PASSWORD: pass123

volumes:
  postgres_data_coffee_app:
